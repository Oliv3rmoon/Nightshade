{
 "name": "Nightshade launcher screens",
 "on": {
  "push": {
   "branches": [
    "test/release-4-screens"
   ]
  },
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "read"
 },
 "jobs": {
  "screens": {
   "runs-on": "ubuntu-24.04",
   "timeout-minutes": 40,
   "defaults": {
    "run": {
     "shell": "bash"
    }
   },
   "steps": [
    {
     "name": "Check out the release branch",
     "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
     "with": {
      "ref": "f0eeafcaf70416783748fa19f5e58dda3376edff",
      "persist-credentials": false
     }
    },
    {
     "name": "Install the preview's tools",
     "run": "sudo apt-get update\nsudo apt-get install --yes --no-install-recommends build-essential python3 libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri libcurl4-openssl-dev libssl-dev nlohmann-json3-dev"
    },
    {
     "name": "Point the preview at the system's nlohmann/json",
     "run": "# preview.sh looks for the copy in the Eden source that make prepare unpacks; the system's is the same library.\nmkdir -p /tmp/edensrc/source/.cache/cpm/nlohmann_json/system\nln -s /usr/include /tmp/edensrc/source/.cache/cpm/nlohmann_json/system/single_include\nmkdir -p .local && echo /tmp/edensrc > .local/headless-cache"
    },
    {
     "name": "Draw the launcher's screens",
     "run": "set -o pipefail\nmkdir -p \"$RUNNER_TEMP/screens/default\" \"$RUNNER_TEMP/screens/nightly\"\nbash -x tools/launcher/preview.sh \"$RUNNER_TEMP/screens/default\" 2>&1 | tail -40\nPE_THEME=nightly bash tools/launcher/preview.sh \"$RUNNER_TEMP/screens/nightly\" 2>&1 | tail -20\nls \"$RUNNER_TEMP/screens\"/*"
    },
    {
     "name": "Keep the screens",
     "if": "always()",
     "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
     "with": {
      "name": "launcher-screens",
      "retention-days": 7,
      "path": "${{ runner.temp }}/screens"
     }
    }
   ]
  }
 }
}
