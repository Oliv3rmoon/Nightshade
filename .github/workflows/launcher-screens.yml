{
 "name": "Launcher screens: which change breaks the preview's checks",
 "on": {
  "push": {
   "branches": [
    "test/release-4-screens"
   ]
  },
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "read"
 },
 "jobs": {
  "screens": {
   "runs-on": "ubuntu-24.04",
   "timeout-minutes": 40,
   "defaults": {
    "run": {
     "shell": "bash"
    }
   },
   "steps": [
    {
     "name": "Check out the commit to compare",
     "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
     "with": {
      "ref": "${{ matrix.ref }}",
      "persist-credentials": false
     }
    },
    {
     "name": "Install the preview's tools",
     "run": "sudo apt-get update\nsudo apt-get install --yes --no-install-recommends build-essential python3 libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri libcurl4-openssl-dev libssl-dev nlohmann-json3-dev"
    },
    {
     "name": "Point the preview at the system's nlohmann/json",
     "run": "# preview.sh looks for the copy in the Eden source that make prepare unpacks; the system's is the same library.\nmkdir -p /tmp/edensrc/source/.cache/cpm/nlohmann_json/system\nln -s /usr/include /tmp/edensrc/source/.cache/cpm/nlohmann_json/system/single_include\nmkdir -p .local && echo /tmp/edensrc > .local/headless-cache"
    },
    {
     "name": "Draw the launcher's screens",
     "run": "mkdir -p \"$RUNNER_TEMP/screens\"\nPE_THEME=\"${{ matrix.theme }}\" bash tools/launcher/preview.sh \"$RUNNER_TEMP/screens\" > \"$RUNNER_TEMP/preview.log\" 2>&1 && code=0 || code=$?\ngrep -E '^error|cues heard' \"$RUNNER_TEMP/preview.log\" || true\necho \"preview exit: $code\""
    },
    {
     "name": "Keep the screens",
     "if": "always()",
     "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
     "with": {
      "name": "launcher-screens-${{ strategy.job-index }}",
      "retention-days": 7,
      "path": "${{ runner.temp }}/screens"
     }
    }
   ],
   "strategy": {
    "fail-fast": false,
    "matrix": {
     "include": [
      {
       "ref": "f0eeafcaf70416783748fa19f5e58dda3376edff",
       "theme": "canopy",
       "what": "release, Canopy theme"
      },
      {
       "ref": "f0eeafcaf70416783748fa19f5e58dda3376edff",
       "theme": "slate",
       "what": "release, Slate theme"
      },
      {
       "ref": "e0e5c45451552252d2f18b6fa81e3657b9213a34",
       "theme": "slate",
       "what": "build 3, Slate theme"
      },
      {
       "ref": "56a6e35a813462205d62cc68eef5fbb5ce0f52dc",
       "theme": "",
       "what": "update feature alone, default theme"
      }
     ]
    }
   },
   "name": "screens (${{ matrix.what }})"
  }
 }
}
